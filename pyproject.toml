[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "cot_functional"
version = "0.1.0"
description = "Connector Theory for cubic Helium: explicit density functionals of the KS potential"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Muhammed Hüseyin Güneş", email = "muhammed.gunes@polytechnique.edu" },
]
dependencies = ["numpy>=1.20", "scipy>=1.7", "matplotlib>=3.4"]

[project.optional-dependencies]
chi = ["chi_mhg"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cot_functional*", "scr*"]

[tool.ruff]
target-version = "py310"
